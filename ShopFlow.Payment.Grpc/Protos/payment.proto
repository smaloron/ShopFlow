syntax = "proto3";
option csharp_namespace = "ShopFlow.Payment.Grpc";
package payment;

service PaymentService {
  rpc ProcessPayment (PaymentRequest) returns (PaymentResponse);
  rpc RefundPayment (RefundRequest) returns (PaymentResponse);
}

message PaymentRequest { string order_id = 1; double amount = 2; string currency = 3; string method = 4; }
message RefundRequest  { string order_id = 1; string transaction_id = 2; double amount = 3; }
message PaymentResponse { bool success = 1; string transaction_id = 2; string error_message = 3; PaymentStatus status = 4; }

enum PaymentStatus { UNSPECIFIED = 0; PENDING = 1; COMPLETED = 2; FAILED = 3; REFUNDED = 4; }
